name: couples_app
description: "Kehai (気配) — a self-hosted little world for two. czuję, że tam jesteś"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.3+4

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  pocketbase: ^0.25.0
  shared_preferences: ^2.5.5
  device_info_plus: ^13.2.0
  dbus: ^0.7.15
  flutter_foreground_task: ^11.0.1
  window_manager: ^0.5.2
  home_widget: ^0.9.3
  tray_manager: ^0.5.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  http: ^1.5.0
  clock: ^1.1.2
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  # Client-side notifications (kb/roadmap.md "client-side notifications v1").
  # ONE plugin covers all three platforms we ship, and each of its platform
  # halves happens to be exactly what we'd have picked separately:
  #   Android — native, per-event NotificationChannels carrying our own raw
  #             sounds (the only way Android will play a custom sound).
  #   Windows — native WinRT toasts, no extra system libraries.
  #   Linux   — pure Dart over D-Bus (org.freedesktop.Notifications): no
  #             native build, no dev headers, nothing to apt-get.
  # `local_notifier` and `audioplayers` were both trialled here and dropped —
  # see "why we play the sound ourselves" in
  # lib/data/services/notifications/kehai_sound_player.dart.
  flutter_local_notifications: ^22.3.0
  # Two FFI calls' worth: `malloc` + `toNativeUtf16()` for the winmm
  # PlaySound path in lib/data/services/notifications/kehai_sound_player.dart.
  # Pure Dart, no native build on any platform.
  ffi: ^2.1.4
  # Windows-only in practice: 0.0.1's LaunchAtStartup.setup() branches on
  # macOS/Windows alone (Linux calls throw LateInitializationError — no
  # backend registered), and every later version needing win32_registry
  # ^2.0.0+ conflicts with device_info_plus 13.2.0's win32_registry ^3.0.3 —
  # no version of this package is resolvable with that dependency in the
  # graph. AutostartService only calls into this on Windows and implements
  # Linux's XDG autostart .desktop file itself (dart:io, no package needed).
  launch_at_startup: ^0.0.1
  # Portal mode's transport (kb/decisions.md ADR-9: raw WebRTC P2P for
  # exactly two peers, no SFU — LiveKit only if hand-rolled signaling gets
  # painful). Signaling rides the existing PocketBase realtime subscription
  # (portal_signals), so this package supplies media only.
  #
  # Per platform:
  #   Android — the maintained libwebrtc AAR; needs CAMERA + RECORD_AUDIO,
  #             which the plugin itself requests at getUserMedia time (see
  #             AndroidManifest.xml). Its minSdk 21 is under ours.
  #   Linux   — bundles its OWN prebuilt libwebrtc.so, downloaded from the
  #             webrtc-sdk GitHub release by CMake on the first build (so
  #             the first `flutter build linux` needs network) and shipped
  #             in bundle/lib/. System deps beyond what Flutter already
  #             needs: none required — GTK is already there, and libpulse
  #             dev headers are OPTIONAL (their absence only disables
  #             getDisplayMedia system-audio loopback, which portal mode
  #             doesn't use; the build prints a warning and carries on).
  #   Windows — same prebuilt-libwebrtc arrangement; nothing to install.
  flutter_webrtc: ^1.6.0
  # The running app's own version string, for in-app auto-updates
  # (docs/superpowers/specs/2026-08-25-auto-updates-design.md): what the
  # GitHub `releases/latest` tag is compared against. Reads the platform's
  # own package metadata (Android PackageInfo, the Windows/Linux bundle's
  # generated version.json), so there is no second place to bump — the
  # `version:` field above is still the only one.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/
    # Tray icons (tool/generate_tray_icon.py): GTK takes the PNG, Windows
    # needs the .ico. tray_manager resolves these paths inside flutter_assets.
    - assets/tray/
    # Notification sounds (tool/generate_notification_sounds.py). Desktop
    # plays these straight from the bundle; Android has its own copies under
    # android/app/src/main/res/raw/ because a NotificationChannel's sound is
    # resolved by the system UI process, which can't read our asset bundle.
    - assets/sounds/
    # App icon set (tool/generate_tray_icon.py). Android/Windows read their
    # copies straight from android/ and windows/ (not from here) — this one
    # PNG is Linux's, set at runtime via windowManager.setIcon() in
    # DesktopWindowService.bootstrap().
    - assets/icons/

  # TODO(fonts): design-language.md specifies Public Pixel (GGBotNet, CC0)
  # for UI chrome and LanaPixel (OpenGameArt) for body text. Both downloads
  # were blocked in this environment (itch.io requires auth to grab the zip;
  # the OpenGameArt direct link 404s). Falling back to Google Fonts
  # "Pixelify Sans" (display / chrome) and "VT323" (body / dense text),
  # both bundled locally as static assets (no CDN calls). Swap the two
  # files in assets/fonts/ and the family names below for the real fonts
  # when they can be downloaded from a machine with browser access.
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
