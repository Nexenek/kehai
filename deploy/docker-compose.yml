services:
  # ---------------------------------------------------------------------
  # server: our Go/PocketBase binary — auth, realtime, SQLite, files,
  # custom couple/heartbeat routes. See ../server/.
  # ---------------------------------------------------------------------
  server:
    build:
      context: ../server
    container_name: kehai-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data/pb:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------
  # ntfy: self-hosted UnifiedPush server for Android push + a plain
  # websocket/HTTP fallback for desktop notifications (see kb/decisions.md
  # ADR-4). Locked down: nobody can read or publish without an account
  # (auth-default-access: deny-all), matching kb/selfhosting.md.
  #
  # First-time setup (after `docker compose up -d ntfy`):
  #   1. Create an admin account (used for the ntfy web app / mobile app login):
  #        docker compose exec ntfy ntfy user add --role=admin <you>
  #   2. Create a couple-scoped topic + a non-admin publish-only token for the
  #      server to use when it starts pushing notifications (Phase 2):
  #        docker compose exec ntfy ntfy user add <partner-a>
  #        docker compose exec ntfy ntfy user add <partner-b>
  #        docker compose exec ntfy ntfy access <partner-a> couple-<id> read-write
  #        docker compose exec ntfy ntfy access <partner-b> couple-<id> read-write
  #   3. On Android, install ntfy (F-Droid build for zero Google deps),
  #      point it at this server's tailnet address as a UnifiedPush
  #      distributor, and log in with the account from step 2.
  # ---------------------------------------------------------------------
  ntfy:
    image: binwiederhier/ntfy
    container_name: kehai-ntfy
    command:
      - serve
    restart: unless-stopped
    environment:
      - NTFY_BASE_URL=http://localhost:8091
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_SIGNUP=false
      - NTFY_ENABLE_LOGIN=true
      - NTFY_BEHIND_PROXY=false
    volumes:
      - ./data/ntfy/cache:/var/cache/ntfy
      - ./data/ntfy/auth:/var/lib/ntfy
    ports:
      - "8091:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://127.0.0.1:80/v1/health | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ---------------------------------------------------------------------
  # backup: nightly tar.gz of ./data (deploy/README.md "Backups"). SQLite
  # dbs are hot-copied via `sqlite3 .backup` (deploy/backup.sh), not a raw
  # file copy, so a live WAL-mode db never gets caught mid-write. Keeps the
  # last 14 nightly archives in ./backups. This is the "good enough for a
  # home server" tier — see deploy/README.md for the borgmatic upgrade path
  # (encrypted, offsite, the real 3-2-1 story from kb/selfhosting.md).
  # ---------------------------------------------------------------------
  backup:
    image: alpine:3.22
    container_name: kehai-backup
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./data/pb:/pb_data
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache sqlite >/dev/null
        # /backup.sh is mounted :ro, so no chmod here (a chmod on a
        # read-only mount fails, and with set -e that failure restart-looped
        # this container every 4s once) — cron runs it through sh instead,
        # which needs no exec bit.
        mkdir -p /var/spool/cron/crontabs
        echo "0 3 * * * sh /backup.sh >> /proc/1/fd/1 2>&1" > /var/spool/cron/crontabs/root
        echo "backup sidecar up — nightly at 03:00, keeping last 14"
        crond -f -d 8

  # ---------------------------------------------------------------------
  # Phase 4 — CalDAV shared calendar (kb/decisions.md ADR-7).
  # ---------------------------------------------------------------------
  # baikal:
  #   image: ckulka/baikal:nginx
  #   container_name: couples-baikal
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/baikal/config:/var/www/baikal/config
  #     - ./data/baikal/data:/var/www/baikal/Specific
  #   ports:
  #     - "8092:80"

  # ---------------------------------------------------------------------
  # Phase 7 — TURN/STUN relay for the WebRTC portal (kb/decisions.md
  # ADR-9). Mostly unnecessary while both partners are on the same
  # Tailscale tailnet; only needed as a NAT-traversal fallback.
  # ---------------------------------------------------------------------
  # Portal mode's NAT-traversal fallback. NOT needed when both phones/
  # tablets reach the server over Tailscale — the peers then connect
  # directly and /api/turn (which answers empty until KEHAI_TURN_SECRET +
  # KEHAI_TURN_URLS are set on the server container) is never consulted.
  # To enable: (1) generate a secret: `openssl rand -hex 32`; (2) put it in
  # .env as KEHAI_TURN_SECRET and add KEHAI_TURN_URLS
  # ("turn:your-host:3478?transport=udp,turn:your-host:3478?transport=tcp")
  # + both vars under the server service's environment; (3) uncomment this
  # block. host networking because TURN relays a range of UDP ports.
  # coturn:
  #   image: coturn/coturn:4
  #   container_name: kehai-coturn
  #   restart: unless-stopped
  #   network_mode: host
  #   command: >
  #     --use-auth-secret
  #     --static-auth-secret=${KEHAI_TURN_SECRET}
  #     --realm=kehai
  #     --listening-port=3478
  #     --min-port=49160 --max-port=49200
  #     --no-cli --no-tls --no-dtls
  #     --fingerprint

  # ---------------------------------------------------------------------
  # Optional, only if something must be reachable outside the tailnet
  # (kb/decisions.md ADR-10). Everything above stays tailnet-only by
  # default — no exposed ports needed for normal use.
  # ---------------------------------------------------------------------
  # caddy:
  #   image: caddy:alpine
  #   container_name: couples-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ./data/caddy/data:/data
  #     - ./data/caddy/config:/config
